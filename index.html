<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><meta name="description" content="AQP FEST — vive la noche. Síguenos en Instagram y TikTok."><title>AQP FEST | Vive la noche</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;background:#050505;color:white;font-family:Arial,Helvetica,sans-serif;display:flex;align-items:center;justify-content:center;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(107deg,transparent 0 33px,#ffffff08 34px 35px),radial-gradient(ellipse at 85% 2%,#ffffff38,transparent 29%),radial-gradient(ellipse at 50% 85%,#ffffff13,transparent 55%);pointer-events:none}.lamp{position:fixed;top:0;right:12%;width:76px;height:28px;background:#eee;border-radius:50%;box-shadow:0 0 35px #fff9,0 0 140px #fff3}.wrap{position:relative;width:min(92%,430px);text-align:center;padding:65px 20px 35px}.crown{font-size:66px;transform:rotate(-10deg);color:#ddd;line-height:1;text-shadow:3px 3px #555}h1{font-size:clamp(62px,15vw,90px);font-weight:1000;letter-spacing:-7px;font-style:italic;line-height:.88;margin:8px 0 22px;text-shadow:3px 3px #666}h1 span{display:block;font-size:.82em;letter-spacing:-5px}.tag{font-size:11px;letter-spacing:4px;color:#aaa;margin:30px 0 42px}.links{display:grid;gap:14px}a{display:block;padding:19px;border:1px solid #888;border-radius:5px;color:white;text-decoration:none;font-weight:800;letter-spacing:2px;transition:.2s}a:first-child{background:#fff;color:#050505}a:hover{transform:translateY(-3px);box-shadow:0 5px 25px #ffffff25}.music{margin-top:33px;border:1px solid #555;background:#ffffff0b;padding:17px;border-radius:7px}.music p{font-size:12px;color:#bbb;margin:7px}.music button{background:#fff;color:#000;border:0;border-radius:50px;padding:12px 22px;font-weight:800;cursor:pointer}footer{margin-top:40px;font-size:10px;letter-spacing:2px;color:#777}body{background-image:linear-gradient(180deg,#0005,#0002 35%,#0009),var(--cover,none);background-position:center;background-size:cover;background-attachment:fixed}.wrap{background:#0004;border-radius:18px;backdrop-filter:blur(2px)}.crown,h1{display:none}.tag{margin-top:54vh;margin-bottom:22px;font-weight:800;color:white;text-shadow:0 2px 7px #000} .lamp{display:none}@media(min-width:700px){.tag{margin-top:45vh}}.gate{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;justify-content:center;padding:0 20px max(10vh,65px);background:#0005;transition:opacity .65s ease,visibility .65s ease}.gate button{width:min(90vw,380px);border:1px solid #fff8;border-radius:50px;padding:20px 24px;background:#fff;color:#111;font-size:15px;font-weight:900;letter-spacing:1.5px;box-shadow:0 8px 40px #000a;cursor:pointer}.gate.hide{opacity:0;visibility:hidden;pointer-events:none}.wrap{opacity:0;transform:translateY(18px);transition:opacity .65s ease,transform .65s ease}body.entered .wrap{opacity:1;transform:none}body:not(.entered) .wrap{pointer-events:none}@media(prefers-reduced-motion:reduce){.gate,.wrap{transition:none}}</style></head><body><div class="gate" id="gate"><button id="enter" type="button">🔊 ENTRAR A LA EXPERIENCIA</button></div><div class="lamp"></div><main class="wrap"><div class="crown">♛</div><h1>aqp<span>Fest</span></h1><div class="tag">LA NOCHE ES NUESTRA</div><div class="links"><a href="https://www.instagram.com/aqp_fest_/" target="_blank" rel="noopener">◎ INSTAGRAM</a><a href="https://www.tiktok.com/@aqp.fest" target="_blank" rel="noopener">♪ TIKTOK</a></div><div class="music"><strong>♫ MEGA WATCHING ME</strong><p>THEUZZO · AQP FEST</p><button id="play" type="button">▶ REPRODUCIR</button><audio id="audio" src="track.mp3" preload="auto" autoplay loop></audio><p id="status">Activa la música para vivir la experiencia</p></div><footer>AREQUIPA · PERÚ — AQP FEST © 2026</footer></main><script>const a=document.getElementById('audio'),b=document.getElementById('play'),s=document.getElementById('status');b.onclick=async()=>{if(!a.paused){a.pause();b.textContent='▶ REPRODUCIR';return}try{await a.play();b.textContent='Ⅱ PAUSAR';s.textContent='SONANDO AHORA'}catch(e){s.textContent='La pista musical todavía no está cargada.'}};;fetch("https://api.github.com/repos/jesuscardm95-a11y/aqp-fest/contents/").then(r=>r.json()).then(files=>{if(!Array.isArray(files))return;const img=files.find(f=>/\.(png|jpe?g|webp)$/i.test(f.name));const music=files.find(f=>/\.mp3$/i.test(f.name));if(img)document.body.style.setProperty("--cover",`url("${img.download_url}")`);if(music){a.src=music.download_url;a.load();}}).catch(()=>{s.textContent="No se pudieron cargar los archivos multimedia"});const startAudio=async()=>{try{await a.play();b.textContent='Ⅱ PAUSAR';s.textContent='SONANDO AHORA'}catch(e){b.textContent='▶ TOCA PARA ESCUCHAR';s.textContent='Toca la pantalla para activar la música';}};document.getElementById('enter').addEventListener('click',async()=>{document.body.classList.add('entered');document.getElementById('gate').classList.add('hide');await startAudio()});</script></body></html>
